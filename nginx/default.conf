# Nginx reverse proxy cho toàn bộ hệ thống (chạy không đặc quyền: nghe 8080/8443 trong container).
#   /            -> giao diện React (file tĩnh)
#   /api/        -> backend FastAPI
#   /pma/        -> phpMyAdmin
#   /grafana/    -> Grafana
# Dùng resolver + biến để Nginx vẫn khởi động được khi một dịch vụ (ví dụ Grafana) chưa chạy.

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Chống dò mật khẩu: tối đa 5 lần đăng nhập mỗi phút cho mỗi địa chỉ IP
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_status 429;

# Chuyển HTTP sang HTTPS
server {
    listen 8080;
    server_tokens off;
    location / { return 301 https://$host$request_uri; }
}

# Cổng nội bộ cho nginx-prometheus-exporter (không publish ra ngoài)
server {
    listen 8081;
    server_tokens off;
    access_log off;
    location = /stub_status { stub_status; }
}

server {
    listen 8443 ssl;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 10m;

    client_max_body_size 3m;     # đủ cho ảnh poster tối đa 2 MB
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # ---- API ----
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- phpMyAdmin ----
    location = /pma { return 301 /pma/; }
    location /pma/ {
        set $pma http://phpmyadmin:80;
        rewrite ^/pma/(.*)$ /$1 break;
        proxy_pass $pma;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Grafana ----
    location /grafana/ {
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /grafana/api/live/ {
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
    }

    # ---- Ảnh poster do quản trị viên tải lên (volume dùng chung với backend, Nginx chỉ đọc) ----
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        autoindex off;
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'" always;
    }

    # ---- Giao diện React ----
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 7d;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
