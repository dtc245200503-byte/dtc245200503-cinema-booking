# ===== Lớp 2: Prometheus + Grafana + cAdvisor + exporter (container, web server, database) =====
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cinema-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9095:9090"     # chỉ truy cập từ chính máy chủ (dùng SSH tunnel nếu cần)
    networks:
      monitoring: {}
      edge: {}

  grafana:
    image: grafana/grafana:11.2.0
    container_name: cinema-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?thiếu GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SERVER_ROOT_URL: ${PUBLIC_URL:-https://localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      app: {}
      monitoring: {}

  cadvisor:
    image: ghcr.io/google/cadvisor:0.54.0
    container_name: cinema-cadvisor
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    networks:
      monitoring: {}

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: cinema-mysqld-exporter
    restart: unless-stopped
    command:
      - --config.my-cnf=/etc/mysqld-exporter/.my.cnf
    volumes:
      - ./secrets/mysqld-exporter.cnf:/etc/mysqld-exporter/.my.cnf:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      data: {}
      monitoring: {}

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: cinema-nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      monitoring: {}

volumes:
  prometheus-data: {}
  grafana-data: {}
